<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>可児市観光マップ</title>

<style>
html,
body {
    height: 100%;
    margin: 0;
    padding: 0;
}

#map {
    width: 100%;
    height: 100vh;
}
</style>

<script>
var map;

function initMap() {

    map = new google.maps.Map(document.getElementById("map"), {
        zoom: 12,

        center: {
            lat: 35.4230,
            lng: 137.0200
        },

        zoomControl: false,

        mapTypeControl: true,

        streetViewControl: false,

        fullscreenControl: false,

        rotateControl: false,

        scaleControl: false
    });

    drawRoute();
}

window.initMap = initMap;
</script>

</head>

<body>

<div id="map"></div>

<script src="レイヤー・ライン・アニメーション.js"></script>

<script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCAKLjisxFelKwIl1_G6MiEO9-ya7Twr5s&callback=initMap">
</script>

</body>
</html>
